services:
  - type: web
    name: ads-food-waste-prediction
    runtime: python
    plan: free
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.10
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn web_dashboard:app --bind 0.0.0.0:$PORT --workers 1 --threads 4 --timeout 120
    healthCheckPath: /api/summary
